# Security updates require dependency graph, Dependabot alerts and security updates enabled in repository settings.
# A zero version-PR limit preserves security updates; it does not enable those settings.
# Docker/Compose and SDK updates are monthly, capped maintenance updates, not vulnerability scanning.
version: 2
updates:
- package-ecosystem: docker
  directory: /quickerwrite-runner
  schedule:
    interval: monthly
  open-pull-requests-limit: 1
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
  groups:
    maintenance:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
  groups:
    security:
      applies-to: security-updates
      patterns:
      - '*'
